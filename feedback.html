<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Page</title>
</head>
<body>
        <header>
            <h1>Feedback Form</h1>
        </header>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="feedback.html">feedback</a></li>
                <li><a href="grades.html">Grades</a></li>
                <li><a href="contact.html">Contact us</a></li>
            </ul>
        </nav>
        <main>

            <h2>Share your Feedback</h2>

            <p>
                Please fill in the form below to share your thoughts about the courses and this portal.
            </p>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <br>
                <input type="text" id="name" name="name">
                <br><br>

                <label for="email">Email:</label>
                <br>
                <input type="email" id="email" name="email">
                <br><br>

                <p>Gender:</p>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>

                <br><br>

                <label for="course">Select Course:</label>
                <br>

                <select id="course" name="course">
                    <option value="html">HTML & web Fundamentals</option>
                    <option value="CSS">CSS & Responsive Design</option>
                    <option value="javascript">Javascript Programming</option>
                    <option value="dbms">Database Management Systems</option>

                </select>

                <br><br>

                <textarea id="feedback" name="feedback" rows="5" cols="40"></textarea>

                <br><br>

                <label for="rating">Rate the Portal:</label>
                <br>

               <select id="rating" name="rating">
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - very good</option>
                    <option value="3">3 - good</option>
                    <option value="2">2 - Average</option>
                    <option value="1">1 - Needs Improvement</option>

               </select>
               <br><br>

              <input type="checkbox" id="updates" name="updates">
              <label for="updates">
                subscribe to recieve updates
              </label>

              <br><br>

              <button type="submit">Submit</button>
              <button type="reset">Reset</button>

            </form>

        </main>

        <footer>
            <p>&copy; 2026 student Portal. All rights reserved</p>
        </footer>
        
    </body>
    
</html>
